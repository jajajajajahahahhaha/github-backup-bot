name: GitHub Backup Bot

on:
  schedule:
    # هر ۵.۵ ساعت یک بار
    - cron: '0 */5 * * *'   # هر 5 ساعت (نزدیک‌ترین به 5.5 که cron ساپورت میکنه)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/bot.yml'
      - 'requirements.txt'

concurrency:
  group: backup-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # حدود 5 ساعت و 40 دقیقه، کمتر از سقف 6 ساعت
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          MEMORY_REPO: ${{ secrets.MEMORY_REPO }}
          POLL_DURATION_SECONDS: "19200"   # 5h20m
          REPO_CHECK_INTERVAL: "300"       # 5min
        run: |
          python -m bot.main
